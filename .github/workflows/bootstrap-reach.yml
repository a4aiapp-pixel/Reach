name: Import Reach source and verify Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Reach-Android-GitHub-Ready-v1.0.0.zip"
      - ".github/workflows/bootstrap-reach.yml"

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Reach
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Safely extract project source into repository root
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import stat
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path("Reach-Android-GitHub-Ready-v1.0.0.zip")
          prefix = "Reach-Android-v1.0.0/"
          assert archive.is_file(), "Reach source ZIP is missing"
          with ZipFile(archive) as z:
              names = z.namelist()
              assert "Reach-Android-v1.0.0/pubspec.yaml" in names, "Invalid Reach project"
              for item in z.infolist():
                  name = item.filename
                  if not name.startswith(prefix):
                      raise ValueError(f"Unexpected archive path: {name!r}")
                  relative = PurePosixPath(name[len(prefix):])
                  if not relative.parts:
                      continue
                  if relative.is_absolute() or ".." in relative.parts:
                      raise ValueError(f"Unsafe archive path: {name!r}")
                  if stat.S_ISLNK(item.external_attr >> 16):
                      raise ValueError(f"Unexpected symlink: {name!r}")
                  dest = Path(*relative.parts)
                  if item.is_dir():
                      dest.mkdir(parents=True, exist_ok=True)
                      continue
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(item))
          print("Reach source extracted:", len(names), "archive entries")
          PY

      - name: Save unpacked source files to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- . ':!.github/workflows/android.yml'
          if ! git diff --cached --quiet; then
            git commit -m "Import Reach v1.0.0 Android application source"
            git push origin HEAD:main
          else
            echo "Reach source files are already committed."
          fi

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Create Android platform files
        run: flutter create --platforms=android --project-name reach_network --org app.reachnetwork .

      - name: Apply Reach Android permissions and build configuration
        run: python3 tools/prepare_android.py

      - name: Install Dart packages
        run: flutter pub get

      - name: Analyze source
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Build debug APK for setup testing
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Reach-debug-unconfigured
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
