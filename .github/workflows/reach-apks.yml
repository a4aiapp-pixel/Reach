name: Reach Android - Universal and ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "tools/**"
      - "assets/branding/**"
      - "pubspec.yaml"
      - ".github/workflows/reach-apks.yml"

# Avoid multiple expensive private-repository builds after rapid source updates.
concurrency:
  group: reach-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# Calls are enabled only for internal QA candidates. Camera/mic permission
# is still gated by per-member consent and accepted connections.
env:
  REACH_ENABLE_CALLS: '1'

jobs:
  verify-and-build:
    name: Verify, compile universal and ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21 for Android lint
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Flutter 3.50
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Generate Android project without premature dependency resolution
        run: flutter create --no-pub --platforms=android --project-name reach_network --org app.reachnetwork .

      - name: Remove Flutter's generic template test
        run: rm -f test/widget_test.dart

      - name: Prepare pinned icon rendering environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/reach-icon-venv
          /tmp/reach-icon-venv/bin/python -m pip install --disable-pip-version-check -q Pillow==11.3.0
      - name: Apply Reach Android configuration and logo
        run: /tmp/reach-icon-venv/bin/python tools/prepare_android.py

      - name: Build GeoNames offline country and city suggestions
        shell: bash
        run: |
          set -euo pipefail
          /tmp/reach-icon-venv/bin/python -m pip install --disable-pip-version-check -q geonamescache==3.0.2
          /tmp/reach-icon-venv/bin/python tools/generate_geo_assets.py
          test -s assets/geodata/countries.tsv
          test -s assets/geodata/cities.tsv
      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify project static analysis
        run: flutter analyze --no-fatal-infos

      - name: Execute model and widget tests
        run: flutter test

      - name: Prepare persistent upload-key signing when securely configured
        shell: bash
        env:
          PLAY_KEYSTORE_B64: ${{ secrets.PLAY_KEYSTORE_B64 }}
          PLAY_KEYSTORE_PASS: ${{ secrets.PLAY_KEYSTORE_PASS }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASS: ${{ secrets.PLAY_KEY_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$PLAY_KEYSTORE_B64" ] && [ -z "$PLAY_KEYSTORE_PASS" ] &&
             [ -z "$PLAY_KEY_ALIAS" ] && [ -z "$PLAY_KEY_PASS" ]; then
            echo "Persistent signing is not configured; these are test APKs only."
            echo "REACH_SIGNING_ENABLED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          for variable in PLAY_KEYSTORE_B64 PLAY_KEYSTORE_PASS PLAY_KEY_ALIAS PLAY_KEY_PASS; do
            if [ -z "${!variable}" ]; then
              echo "::error::Incomplete persistent signing configuration: $variable"
              exit 1
            fi
          done
          mkdir -p android/app
          printf '%s' "$PLAY_KEYSTORE_B64" | base64 --decode > android/app/upload-key.jks
          {
            echo "storeFile=upload-key.jks"
            printf 'storePassword=%s\n' "$PLAY_KEYSTORE_PASS"
            printf 'keyAlias=%s\n' "$PLAY_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$PLAY_KEY_PASS"
          } > android/key.properties
          chmod 600 android/key.properties android/app/upload-key.jks
          echo "REACH_SIGNING_ENABLED=1" >> "$GITHUB_ENV"

      - name: Apply permanent signing configuration before ALL Android builds
        if: env.REACH_SIGNING_ENABLED == '1'
        env:
          REACH_SIGNING_ENABLED: '1'
        run: /tmp/reach-icon-venv/bin/python tools/prepare_android.py

      - name: Build universal release-mode APK
        run: |
          flutter build apk --release --dart-define=ENABLE_REACH_CALLS=true --target-platform android-arm,android-arm64,android-x64
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Reach-v1.2.0-universal-connected.apk

      - name: Build ABI-specific ARM64 release-mode APK
        run: |
          flutter build apk --release --dart-define=ENABLE_REACH_CALLS=true --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Reach-v1.2.0-arm64-v8a-connected.apk

      - name: Integrity checks and artifact inventory
        run: |
          test -s dist/Reach-v1.2.0-universal-connected.apk
          test -s dist/Reach-v1.2.0-arm64-v8a-connected.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          cat > dist/README.txt <<'EOF'
          REACH 1.2.0 - ANDROID RELEASE-CANDIDATE COMPILE
          ==============================================
          UNIVERSAL: ARM32 + ARM64 + x86-64.
          ARM64: Android ARM64 devices only.
          With persistent signing secrets, APKs and AAB use the same protected
          upload key, permitting upgrades from subsequent builds signed by that
          key. Without such secrets, APKs use an ephemeral debug key and cannot
          reliably upgrade previous installs. They are TEST BUILDS ONLY.
          The app connects to Reach's public Supabase endpoint.
          Live authentication and chat still require multi-device validation.
          They are NOT finalized production or Google Play release binaries.
          Configure authentication, SQL migrations, policy pages, moderation,
          Play credentials and release signing before public distribution.
          EOF

      - name: Export official 512px Reach Play icon
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/branding/reach_play_store_icon_512.png
          mkdir -p dist
          cp assets/branding/reach_play_store_icon_512.png dist/Reach-v1.2.0-Play-Icon-512.png
          file dist/Reach-v1.2.0-Play-Icon-512.png

      - name: Confirm live privacy and account-deletion policy URLs
        shell: bash
        run: |
          set -euo pipefail
          base="https://ffnhidnnqpamewcepxrr.supabase.co/functions/v1/reach-legal"
          for page in privacy.html terms.html child-safety.html delete-account.html contact.html; do
            body="$(curl -fLsS --retry 2 --max-time 25 "$base/$page")"
            if [[ "$body" != *"Reach"* ]] || [[ "$body" != *"<html"* ]]; then
              echo "::error::Policy page is not serving the expected HTML: $page"
              exit 1
            fi
          done
          echo "Public privacy, deletion, child safety, community and contact pages are reachable."

      - name: Build signed Android App Bundle for Play internal testing
        if: env.REACH_SIGNING_ENABLED == '1'
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle --release --dart-define=ENABLE_REACH_CALLS=true \
            --dart-define=LEGAL_BASE_URL=https://ffnhidnnqpamewcepxrr.supabase.co/functions/v1/reach-legal
          test -s build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          python3 tools/check_android_bundle.py \
            build/app/outputs/bundle/release/app-release.aab dist/PLAY-PERMISSION-AUDIT.json
          mkdir -p dist
          cp build/app/outputs/bundle/release/app-release.aab dist/Reach-v1.2.0-signed-Play-INTERNAL-TEST.aab
          sha256sum dist/Reach-v1.2.0-signed-Play-INTERNAL-TEST.aab > dist/PLAY-AAB-SHA256.txt
          keytool -printcert -jarfile dist/Reach-v1.2.0-signed-Play-INTERNAL-TEST.aab \
            | grep -E 'Owner:|SHA256:|Signature algorithm name:' > dist/PLAY-SIGNING-INFO.txt
          cat dist/PLAY-SIGNING-INFO.txt

      # GitHub Actions artifact storage is exhausted on the free account.
      # Private GitHub Release assets are a different storage category and
      # provide direct per-file links without adding paid charges. This is
      # strictly a QA pre-release, never a Google Play production publication.
      - name: Publish signed build as private-repository QA pre-release
        if: env.REACH_SIGNING_ENABLED == '1'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="reach-v1.2.0-qa-${GITHUB_SHA:0:10}"
          for file in \
            dist/Reach-v1.2.0-universal-connected.apk \
            dist/Reach-v1.2.0-arm64-v8a-connected.apk \
            dist/Reach-v1.2.0-signed-Play-INTERNAL-TEST.aab \
            dist/PLAY-PERMISSION-AUDIT.json \
            dist/PLAY-SIGNING-INFO.txt \
            dist/PLAY-AAB-SHA256.txt \
            dist/SHA256SUMS.txt \
            dist/README.txt \
            dist/Reach-v1.2.0-Play-Icon-512.png; do
            test -s "$file"
          done
          gh release create "$tag" \
            dist/Reach-v1.2.0-universal-connected.apk \
            dist/Reach-v1.2.0-arm64-v8a-connected.apk \
            dist/Reach-v1.2.0-signed-Play-INTERNAL-TEST.aab \
            dist/PLAY-PERMISSION-AUDIT.json \
            dist/PLAY-SIGNING-INFO.txt \
            dist/PLAY-AAB-SHA256.txt \
            dist/SHA256SUMS.txt \
            dist/README.txt \
            dist/Reach-v1.2.0-Play-Icon-512.png \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease \
            --title "Reach v1.2.0 - signed internal QA (${GITHUB_SHA:0:10})" \
            --notes "Internal testing candidate, NOT a verified Google Play production release. Includes ten redesigned Reach themes, separate universal/ARM64 APKs, persistent upload-key signed AAB, SHA-256 checksums, and Android permission audit. Two-account calling, discovery, moderation and real-device acceptance are still pending."
          echo "QA release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '[.assets[].name] | sort | .[]'

      - name: Securely discard Play signing material
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/app/upload-key.jks
