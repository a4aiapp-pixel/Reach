name: Reach Android - Universal and ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "tools/**"
      - "pubspec.yaml"
      - ".github/workflows/reach-apks.yml"

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify, compile universal and ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21 for Android lint
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Flutter 3.50
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Generate Android project without premature dependency resolution
        run: flutter create --no-pub --platforms=android --project-name reach_network --org app.reachnetwork .

      - name: Remove Flutter's generic template test
        run: rm -f test/widget_test.dart

      - name: Apply Reach Android configuration and logo
        run: python3 tools/prepare_android.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify project static analysis
        run: flutter analyze --no-fatal-infos

      - name: Execute model and widget tests
        run: flutter test

      - name: Require public Supabase build variables
        env:
          REACH_URL: ${{ vars.SUPABASE_URL }}
          REACH_PUBLIC_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$REACH_URL" || { echo "Set SUPABASE_URL repository variable"; exit 1; }
          test -n "$REACH_PUBLIC_KEY" || { echo "Set SUPABASE_PUBLISHABLE_KEY repository variable"; exit 1; }

      - name: Build universal release-mode APK
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64 --dart-define=SUPABASE_URL="${{ vars.SUPABASE_URL }}" --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ vars.SUPABASE_PUBLISHABLE_KEY }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Reach-v1.0.0-universal-unconfigured.apk

      - name: Build ABI-specific ARM64 release-mode APK
        run: |
          flutter build apk --release --split-per-abi --dart-define=SUPABASE_URL="${{ vars.SUPABASE_URL }}" --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ vars.SUPABASE_PUBLISHABLE_KEY }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Reach-v1.0.0-arm64-v8a-unconfigured.apk

      - name: Integrity checks and artifact inventory
        run: |
          test -s dist/Reach-v1.0.0-universal-unconfigured.apk
          test -s dist/Reach-v1.0.0-arm64-v8a-unconfigured.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          cat > dist/README.txt <<'EOF'
          REACH 1.0.0 - ANDROID COMPILATION TEST BUILDS
          ==============================================
          UNIVERSAL: ARM32 + ARM64 + x86-64.
          ARM64: Android ARM64 devices only.
          These APKs use the Flutter template's debug signing key, not a secure
          Play upload key. They display a backend-configuration screen until
          real SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY are passed at build time.
          They are NOT finalized production or Google Play release binaries.
          Configure authentication, SQL migrations, policy pages, moderation,
          Play credentials and release signing before public distribution.
          EOF

      - name: Upload both Android APKs and SHA256 hashes
        uses: actions/upload-artifact@v4
        with:
          name: Reach-v1.0.0-Universal-and-ARM64-APK-unconfigured
          path: dist/
          if-no-files-found: error
          retention-days: 14
