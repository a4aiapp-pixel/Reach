name: Reach Android - Universal and ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "tools/**"
      - "pubspec.yaml"
      - ".github/workflows/reach-apks.yml"

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify, compile universal and ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21 for Android lint
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Flutter 3.50
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Generate Android project without premature dependency resolution
        run: flutter create --no-pub --platforms=android --project-name reach_network --org app.reachnetwork .

      - name: Remove Flutter's generic template test
        run: rm -f test/widget_test.dart

      - name: Apply Reach Android configuration and logo
        run: python3 tools/prepare_android.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify project static analysis
        run: flutter analyze --no-fatal-infos

      - name: Execute model and widget tests
        run: flutter test

      - name: Build universal release-mode APK
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Reach-v1.0.0-universal-connected.apk

      - name: Build ABI-specific ARM64 release-mode APK
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Reach-v1.0.0-arm64-v8a-connected.apk

      - name: Integrity checks and artifact inventory
        run: |
          test -s dist/Reach-v1.0.0-universal-connected.apk
          test -s dist/Reach-v1.0.0-arm64-v8a-connected.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          cat > dist/README.txt <<'EOF'
          REACH 1.0.0 - ANDROID COMPILATION TEST BUILDS
          ==============================================
          UNIVERSAL: ARM32 + ARM64 + x86-64.
          ARM64: Android ARM64 devices only.
          These APKs use the Flutter template's debug signing key, not a secure
          Play upload key. They use Reach's public Supabase endpoint and publishable client key.
          Live authentication and chat still require multi-device validation.
          They are NOT finalized production or Google Play release binaries.
          Configure authentication, SQL migrations, policy pages, moderation,
          Play credentials and release signing before public distribution.
          EOF

      - name: Upload universal APK separately
        uses: actions/upload-artifact@v4
        with:
          name: Reach-v1.0.0-Universal-APK
          path: dist/Reach-v1.0.0-universal-connected.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARM64 APK separately
        uses: actions/upload-artifact@v4
        with:
          name: Reach-v1.0.0-ARM64-APK
          path: dist/Reach-v1.0.0-arm64-v8a-connected.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksums and build notes
        uses: actions/upload-artifact@v4
        with:
          name: Reach-v1.0.0-Build-Checksums
          path: |
            dist/SHA256SUMS.txt
            dist/README.txt
          if-no-files-found: error
          retention-days: 14
