name: Reach Android - Universal and ARM64 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "tools/**"
      - "pubspec.yaml"
      - ".github/workflows/reach-apks.yml"

# Avoid multiple expensive private-repository builds after rapid source updates.
concurrency:
  group: reach-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-build:
    name: Verify, compile universal and ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21 for Android lint
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Flutter 3.50
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Generate Android project without premature dependency resolution
        run: flutter create --no-pub --platforms=android --project-name reach_network --org app.reachnetwork .

      - name: Remove Flutter's generic template test
        run: rm -f test/widget_test.dart

      - name: Apply Reach Android configuration and logo
        run: python3 tools/prepare_android.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify project static analysis
        run: flutter analyze --no-fatal-infos

      - name: Execute model and widget tests
        run: flutter test

      - name: Prepare persistent upload-key signing when securely configured
        shell: bash
        env:
          PLAY_KEYSTORE_B64: ${{ secrets.PLAY_KEYSTORE_B64 }}
          PLAY_KEYSTORE_PASS: ${{ secrets.PLAY_KEYSTORE_PASS }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASS: ${{ secrets.PLAY_KEY_PASS }}
        run: |
          set -euo pipefail
          if [ -z "$PLAY_KEYSTORE_B64" ] && [ -z "$PLAY_KEYSTORE_PASS" ] &&
             [ -z "$PLAY_KEY_ALIAS" ] && [ -z "$PLAY_KEY_PASS" ]; then
            echo "Persistent signing is not configured; these are test APKs only."
            echo "REACH_SIGNING_ENABLED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          for variable in PLAY_KEYSTORE_B64 PLAY_KEYSTORE_PASS PLAY_KEY_ALIAS PLAY_KEY_PASS; do
            if [ -z "${!variable}" ]; then
              echo "::error::Incomplete persistent signing configuration: $variable"
              exit 1
            fi
          done
          mkdir -p android/app
          printf '%s' "$PLAY_KEYSTORE_B64" | base64 --decode > android/app/upload-key.jks
          {
            echo "storeFile=upload-key.jks"
            printf 'storePassword=%s\n' "$PLAY_KEYSTORE_PASS"
            printf 'keyAlias=%s\n' "$PLAY_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$PLAY_KEY_PASS"
          } > android/key.properties
          chmod 600 android/key.properties android/app/upload-key.jks
          echo "REACH_SIGNING_ENABLED=1" >> "$GITHUB_ENV"

      - name: Apply permanent signing configuration before ALL Android builds
        if: env.REACH_SIGNING_ENABLED == '1'
        env:
          REACH_SIGNING_ENABLED: '1'
        run: python3 tools/prepare_android.py

      - name: Build universal release-mode APK
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/Reach-v1.0.1-universal-connected.apk

      - name: Build ABI-specific ARM64 release-mode APK
        run: |
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/Reach-v1.0.1-arm64-v8a-connected.apk

      - name: Integrity checks and artifact inventory
        run: |
          test -s dist/Reach-v1.0.1-universal-connected.apk
          test -s dist/Reach-v1.0.1-arm64-v8a-connected.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          cat > dist/README.txt <<'EOF'
          REACH 1.0.1 - ANDROID RELEASE-CANDIDATE COMPILE
          ==============================================
          UNIVERSAL: ARM32 + ARM64 + x86-64.
          ARM64: Android ARM64 devices only.
          With persistent signing secrets, APKs and AAB use the same protected
          upload key, permitting upgrades from subsequent builds signed by that
          key. Without such secrets, APKs use an ephemeral debug key and cannot
          reliably upgrade previous installs. They are TEST BUILDS ONLY.
          The app connects to Reach's public Supabase endpoint.
          Live authentication and chat still require multi-device validation.
          They are NOT finalized production or Google Play release binaries.
          Configure authentication, SQL migrations, policy pages, moderation,
          Play credentials and release signing before public distribution.
          EOF

      - name: Upload universal APK separately
        uses: actions/upload-artifact@v4
        with:
          name: Reach-v1.0.1-Universal-APK
          path: dist/Reach-v1.0.1-universal-connected.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload ARM64 APK separately
        uses: actions/upload-artifact@v4
        with:
          name: Reach-v1.0.1-ARM64-APK
          path: dist/Reach-v1.0.1-arm64-v8a-connected.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksums and build notes
        uses: actions/upload-artifact@v4
        with:
          name: Reach-v1.0.1-Build-Checksums
          path: |
            dist/SHA256SUMS.txt
            dist/README.txt
          if-no-files-found: error
          retention-days: 14

      # Signed Play candidate is strictly optional. The ordinary APK jobs
      # never require paid services, and no signing secrets are committed.
      - name: Evaluate eligibility for Play bundle build
        shell: bash
        env:
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          LEGAL_BASE_URL: ${{ secrets.LEGAL_BASE_URL }}
        run: |
          set -euo pipefail
          if [ "${REACH_SIGNING_ENABLED:-0}" != "1" ]; then
            echo "REACH_PLAY_CANDIDATE=0" >> "$GITHUB_ENV"
            echo "AAB skipped: no persistent upload key."
          elif [ -z "$SUPPORT_EMAIL" ] || [ -z "$LEGAL_BASE_URL" ] ||
               [ "$LEGAL_BASE_URL" = "https://example.com" ]; then
            echo "REACH_PLAY_CANDIDATE=0" >> "$GITHUB_ENV"
            echo "AAB skipped: verified support email and live HTTPS legal pages needed."
          else
            echo "REACH_PLAY_CANDIDATE=1" >> "$GITHUB_ENV"
          fi

      - name: Build signed Play-candidate Android App Bundle
        if: env.REACH_PLAY_CANDIDATE == '1'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
          LEGAL_BASE_URL: ${{ secrets.LEGAL_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define="SUPPORT_EMAIL=$SUPPORT_EMAIL" \
            --dart-define="LEGAL_BASE_URL=$LEGAL_BASE_URL"
          test -s build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify build/app/outputs/bundle/release/app-release.aab
          cp build/app/outputs/bundle/release/app-release.aab dist/Reach-v1.0.1-signed-Play-CANDIDATE.aab
          sha256sum dist/Reach-v1.0.1-signed-Play-CANDIDATE.aab > dist/PLAY-AAB-SHA256.txt

      - name: Upload signed Play candidate AAB
        if: env.REACH_PLAY_CANDIDATE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: Reach-v1.0.1-SIGNED-PLAY-CANDIDATE
          path: |
            dist/Reach-v1.0.1-signed-Play-CANDIDATE.aab
            dist/PLAY-AAB-SHA256.txt
          if-no-files-found: error
          retention-days: 14

      - name: Securely discard Play signing material
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/app/upload-key.jks
