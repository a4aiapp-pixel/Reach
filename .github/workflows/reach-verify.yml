name: Reach Fast Release Preflight

on:
  push:
    branches:
      - "feature/**"
    paths:
      - "lib/**"
      - "test/**"
      - "tools/**"
      - "assets/branding/**"
      - "pubspec.yaml"
      - ".github/workflows/reach-verify.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reach-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Flutter analyzer, tests, source safety
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true
      - name: Generate compatible Android project
        run: flutter create --no-pub --platforms=android --project-name reach_network --org app.reachnetwork .
      - name: Remove framework template test
        run: rm -f test/widget_test.dart
      - name: Prepare pinned icon rendering environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/reach-icon-venv
          /tmp/reach-icon-venv/bin/python -m pip install --disable-pip-version-check -q Pillow==11.3.0
      - name: Apply Android API 36 and approved Reach branding
        run: /tmp/reach-icon-venv/bin/python tools/prepare_android.py
      - name: Verify no client-side server secrets
        shell: bash
        run: |
          if grep -REn 'sb_secret_[A-Za-z0-9_-]{10}|SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=' lib; then
            echo "::error::A server secret pattern was found in Flutter source"
            exit 1
          fi
          echo "No server secret patterns found in Flutter code"
      - name: Resolve pinned dependencies
        run: flutter pub get
      - name: Analyze project
        run: flutter analyze --no-fatal-infos
      - name: Run automated tests
        run: flutter test --reporter expanded
